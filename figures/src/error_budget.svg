<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" role="img" aria-labelledby="title desc">
  <title id="title">Where the numerical error sits relative to the signal</title>
  <desc id="desc">On a vertical log axis of displacement, the displacements InSAR is meant to recover occupy the millimetre to sub-millimetre band, and atmospheric noise sets the observation floor. The float32 numerical error after paying the squared condition number is about 16 micrometres, which sits below that floor: the digits lost were never readable in the observation.</desc>
  <style>
    text        { font-family: 'Helvetica Neue', Arial, sans-serif; }
    .title      { fill: #333; font-size: 25px; font-weight: 700; }
    .tick       { fill: #777; font-size: 18px; }
    .axis       { stroke: #bbb; stroke-width: 1.5; }
    .band       { fill: #1a6fb5; fill-opacity: 0.12; }
    .band-lbl   { fill: #1a6fb5; font-size: 20px; font-weight: 700; }
    .band-sub   { fill: #1a6fb5; font-size: 17px; }
    .floor      { stroke: #c8641e; stroke-width: 2.4; stroke-dasharray: 7 4; }
    .floor-lbl  { fill: #c8641e; font-size: 18px; font-weight: 700; }
    .err        { stroke: #999; stroke-width: 2.2; stroke-dasharray: 4 4; }
    .err-lbl    { fill: #777; font-size: 18px; }
    .gap        { stroke: #666; stroke-width: 1.6; }
    .gap-lbl    { fill: #666; font-size: 17px; }
  </style>

  <defs>
    <marker id="arw2" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <text class="title" x="270" y="36" text-anchor="middle">Signal vs numerical error</text>

  <!-- vertical log axis -->
  <line class="axis" x1="98" y1="72" x2="98" y2="300"/>
  <text class="tick" x="90" y="115" text-anchor="end">1 mm</text>
  <text class="tick" x="90" y="175" text-anchor="end">0.1 mm</text>
  <text class="tick" x="90" y="235" text-anchor="end">10 µm</text>
  <text class="tick" x="90" y="295" text-anchor="end">1 µm</text>

  <!-- band of displacements the analysis is meant to recover (1 mm to 0.1 mm) -->
  <rect class="band" x="98" y="110" width="330" height="60"/>
  <text class="band-lbl" x="263" y="135" text-anchor="middle">Displacement to recover</text>
  <text class="band-sub" x="263" y="157" text-anchor="middle">(millimetre to sub-millimetre)</text>

  <!-- observation floor -->
  <line class="floor" x1="98" y1="170" x2="428" y2="170"/>
  <text class="floor-lbl" x="102" y="190">Observation floor (atmosphere)</text>

  <!-- float32 numerical error, about 16 µm -->
  <line class="err" x1="98" y1="218" x2="428" y2="218"/>
  <text class="err-lbl" x="102" y="242">Numerical error after κ² ≈ 16 µm</text>

  <!-- margin between the floor and the error -->
  <line class="gap" x1="462" y1="172" x2="462" y2="216"
        marker-start="url(#arw2)" marker-end="url(#arw2)"/>
  <text class="gap-lbl" x="472" y="200">margin</text>
</svg>
