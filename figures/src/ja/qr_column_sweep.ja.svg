<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 435" role="img" aria-labelledby="title desc">
  <title id="title">QR 分解の列ごとの逐次処理は、バッチにしても 1 枚ごとに残る</title>
  <desc id="desc">同じ形の縦長行列が横に 4 枚並び、その先に「… × 約4万枚」と続く。どの行列も左端の数列は処理済み、オレンジの細い 1 列がいま処理中で、そこで作った変換を右側の残り全部に掛ける矢印が描かれている。上部には「列1 → 列2 → 列3 → … → 列97」というステップの連鎖があり、前の列が終わるまで次に進めないことを示す。横に並べてバッチ化しても 97 ステップの順番待ちは 1 枚ごとに残る。積んで見れば 4万 × 288 × 97 の直方体(テンソル)。</desc>
  <style>
    text     { font-family: 'Helvetica Neue', Arial, sans-serif; }
    .border  { fill: none; stroke: #0084ff; stroke-width: 2.4; }
    .done    { fill: #e3e3e3; }
    .cur     { fill: #e8833a; fill-opacity: 0.9; }
    .rest    { fill: #0084ff; fill-opacity: 0.10; }
    .sweep   { stroke: #e8833a; stroke-width: 2.2; }
    .leader  { stroke: #e8833a; stroke-width: 1.2; }
    .leader2 { stroke: #aaa; stroke-width: 1.2; }
    .step    { fill: #ffffff; stroke: #888; stroke-width: 1.6; }
    .chain   { stroke: #888; stroke-width: 1.8; }
    .lbl-sm  { fill: #444; font-size: 13.5px; font-weight: 700; }
    .sub     { fill: #888; font-size: 12.5px; }
    .cur-lbl { fill: #e8833a; font-size: 13px; font-weight: 700; }
    .step-t  { fill: #444; font-size: 11.5px; }
    .dots    { fill: #888; font-size: 22px; font-weight: 700; }
    .badge   { fill: #e8833a; font-size: 26px; font-weight: 700; }
  </style>

  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
    <marker id="arwo" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e8833a"/>
    </marker>
    <pattern id="cols" x="60" y="80" patternUnits="userSpaceOnUse" width="7" height="288">
      <line x1="0" y1="0" x2="0" y2="288" stroke="#0084ff" stroke-opacity="0.15" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- step chain: one column at a time, in order -->
  <rect class="step" x="200" y="18" width="30" height="26"/>
  <text class="step-t" x="215" y="35" text-anchor="middle">列1</text>
  <line class="chain" x1="232" y1="31" x2="242" y2="31" marker-end="url(#arw)"/>
  <rect class="step" x="244" y="18" width="30" height="26"/>
  <text class="step-t" x="259" y="35" text-anchor="middle">列2</text>
  <line class="chain" x1="276" y1="31" x2="286" y2="31" marker-end="url(#arw)"/>
  <rect class="step" x="288" y="18" width="30" height="26"/>
  <text class="step-t" x="303" y="35" text-anchor="middle">列3</text>
  <text class="lbl-sm" x="326" y="36">…</text>
  <rect class="step" x="350" y="18" width="38" height="26"/>
  <text class="step-t" x="369" y="35" text-anchor="middle">列97</text>
  <text class="lbl-sm" x="402" y="36">97 ステップの順番待ち</text>
  <text class="sub" x="200" y="62">前の列が終わるまで、次に進めない</text>

  <!-- current-column pointer on the first matrix -->
  <text class="cur-lbl" x="84" y="56" text-anchor="middle">いまの列</text>
  <line class="leader" x1="84" y1="60" x2="84" y2="78"/>

  <!-- the batch: the same tall matrix, side by side -->
  <g>
    <rect class="done" x="60" y="80" width="21" height="288"/>
    <rect class="cur"  x="81" y="80" width="7"  height="288"/>
    <rect class="rest" x="88" y="80" width="69" height="288"/>
    <rect x="60" y="80" width="97" height="288" fill="url(#cols)"/>
    <rect class="border" x="60" y="80" width="97" height="288"/>
    <line class="sweep" x1="93" y1="108" x2="150" y2="108" marker-end="url(#arwo)"/>
  </g>
  <g>
    <rect class="done" x="172" y="80" width="21" height="288"/>
    <rect class="cur"  x="193" y="80" width="7"  height="288"/>
    <rect class="rest" x="200" y="80" width="69" height="288"/>
    <rect x="172" y="80" width="97" height="288" fill="url(#cols)"/>
    <rect class="border" x="172" y="80" width="97" height="288"/>
    <line class="sweep" x1="205" y1="108" x2="262" y2="108" marker-end="url(#arwo)"/>
  </g>
  <g>
    <rect class="done" x="284" y="80" width="21" height="288"/>
    <rect class="cur"  x="305" y="80" width="7"  height="288"/>
    <rect class="rest" x="312" y="80" width="69" height="288"/>
    <rect x="284" y="80" width="97" height="288" fill="url(#cols)"/>
    <rect class="border" x="284" y="80" width="97" height="288"/>
    <line class="sweep" x1="317" y1="108" x2="374" y2="108" marker-end="url(#arwo)"/>
  </g>
  <g>
    <rect class="done" x="396" y="80" width="21" height="288"/>
    <rect class="cur"  x="417" y="80" width="7"  height="288"/>
    <rect class="rest" x="424" y="80" width="69" height="288"/>
    <rect x="396" y="80" width="97" height="288" fill="url(#cols)"/>
    <rect class="border" x="396" y="80" width="97" height="288"/>
    <line class="sweep" x1="429" y1="108" x2="486" y2="108" marker-end="url(#arwo)"/>
  </g>

  <!-- and so on, forty thousand times -->
  <text class="dots" x="506" y="232">…</text>
  <text class="badge" x="540" y="226">× 約4万枚</text>
  <text class="sub" x="540" y="252">一度に処理するぶん</text>

  <!-- processed-columns pointer -->
  <line class="leader2" x1="70" y1="370" x2="70" y2="378"/>
  <text class="sub" x="70" y="394" text-anchor="middle">処理済み</text>

  <text class="lbl-sm" x="180" y="395">横に並べて(=バッチ化して)も、97ステップの順番待ちは1枚ごとに残る</text>
  <text class="sub" x="180" y="414">積んで見れば 4万 × 288 × 97 の直方体(テンソル)</text>
</svg>
