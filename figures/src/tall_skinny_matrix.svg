<svg xmlns="http://www.w3.org/2000/svg" viewBox="138 0 690 382" role="img" aria-labelledby="title desc">
  <title id="title">The per-pixel tall-skinny matrix, drawn to scale</title>
  <desc id="desc">The design matrix of one pixel from the benchmark scene, drawn to true proportions: 288 rows (observations, the network edges) by 97 columns (unknowns, acquisition dates minus one). A dashed line after the first 97 rows marks where the number of equations equals the number of unknowns; the remaining 191 rows are redundant observations that average out noise and stiffen the network.</desc>
  <style>
    text    { font-family: 'Helvetica Neue', Arial, sans-serif; }
    .mat    { fill: #ffffff; stroke: #1a6fb5; stroke-width: 2.4; }
    .dim    { stroke: #888; stroke-width: 1.8; }
    .cut    { stroke: #c8641e; stroke-width: 2; stroke-dasharray: 6 4; }
    .brk    { stroke: #aaa; stroke-width: 1.5; fill: none; }
    .lbl    { fill: #333; font-size: 22.4px; font-weight: 700; }
    .lbl-sm { fill: #333; font-size: 18.9px; font-weight: 700; }
    .sub    { fill: #777; font-size: 17.5px; }
    .math   { font-family: Georgia, 'Times New Roman', serif; font-style: italic; }
  </style>

  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
    <pattern id="rows" x="280" y="58" patternUnits="userSpaceOnUse" width="97" height="12">
      <line x1="0" y1="0" x2="97" y2="0" stroke="#1a6fb5" stroke-opacity="0.18" stroke-width="1"/>
    </pattern>
  </defs>

  <g transform="translate(130,0)">
    <!-- P (columns) dimension -->
    <text class="lbl" x="248" y="24" text-anchor="middle"><tspan class="math">P</tspan> = 97 columns</text>
    <text class="sub" x="248" y="42" text-anchor="middle">unknowns = acquisition dates − 1</text>
    <line class="dim" x1="200" y1="50" x2="297" y2="50" marker-start="url(#arw)" marker-end="url(#arw)"/>

    <!-- K (rows) dimension -->
    <line class="dim" x1="182" y1="58" x2="182" y2="346" marker-start="url(#arw)" marker-end="url(#arw)"/>
    <text class="lbl" x="170" y="196" text-anchor="end"><tspan class="math">K</tspan> = 288 rows</text>
    <text class="sub" x="170" y="216" text-anchor="end">observations =</text>
    <text class="sub" x="170" y="236" text-anchor="end">image pairs (edges)</text>

    <!-- the matrix, drawn to true 288 x 97 scale -->
    <rect class="mat" x="200" y="58" width="97" height="288"/>
    <rect x="200" y="58" width="97" height="288" fill="url(#rows)"/>

    <!-- just-determined cut: the first P rows -->
    <line class="cut" x1="200" y1="155" x2="297" y2="155"/>
    <path class="brk" d="M 305 58 h 8 v 97 h -8"/>
    <text class="lbl-sm" x="330" y="98">Enough equations by this line</text>
    <text class="sub" x="330" y="117">97 rows = as many as the unknowns</text>
    <path class="brk" d="M 305 163 h 8 v 183 h -8"/>
    <text class="lbl-sm" x="330" y="245">191 more rows: redundant observations</text>
    <text class="sub" x="330" y="264">averaging noise, stiffening the network</text>

    <text class="sub" x="248" y="368" text-anchor="middle">one pixel</text>
  </g>
</svg>
